name: open-source-samples
on:
  workflow_dispatch: {}

jobs:
  mpfb-child:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Libraries
        run: sudo apt-get update -q && sudo apt-get install -y -q libxi6 libxxf86vm1 libxfixes3 libxrender1 libgl1 libegl1 libxkbcommon0 libsm6
      - name: Blender 4.2 LTS
        run: |
          curl -sSL -o b.tar.xz https://download.blender.org/release/Blender4.2/blender-4.2.3-linux-x64.tar.xz
          tar -xf b.tar.xz && mv blender-4.2.3-linux-x64 blender
      - name: Get MPFB2 (CC0 output) from the Blender extensions site
        run: |
          python3 - <<'EOF'
          import json, urllib.request
          d = json.load(urllib.request.urlopen("https://extensions.blender.org/api/v1/extensions/", timeout=60))
          items = d.get("data", d)
          e = next(x for x in items if x.get("id") == "mpfb")
          print("MPFB", e.get("version"), e.get("license"), e.get("blender_version_min"))
          urllib.request.urlretrieve(e["archive_url"], "mpfb.zip")
          EOF
          ls -la mpfb.zip
          ./blender/blender -b --command extension install-file -r user_default -e mpfb.zip
      - name: Make two children and render
        run: ./blender/blender -b -noaudio --python sample_mpfb_child.py -- out 2>&1 | grep -vE "^Fra:|Sample [0-9]" | tail -n 80
      - uses: actions/upload-artifact@v4
        with: { name: mpfb-child, path: out, retention-days: 7 }

  triposr-object:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.10" }
      - name: Libraries
        run: sudo apt-get update -q && sudo apt-get install -y -q libxi6 libxxf86vm1 libxfixes3 libxrender1 libgl1 libegl1 libxkbcommon0 libsm6 cmake
      - name: TripoSR (MIT) on CPU
        run: |
          git clone --depth 1 https://github.com/VAST-AI-Research/TripoSR.git
          pip install -q torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -q -r TripoSR/requirements.txt
      - name: Fetch a freely licensed charpai photo from Wikimedia Commons
        run: |
          python3 - <<'EOF'
          import json, urllib.request, urllib.parse
          H = {"User-Agent": "toon-render-lab sample (github actions)"}
          q = urllib.parse.urlencode({"action": "query", "format": "json", "generator": "search", "gsrnamespace": 6, "gsrsearch": "charpai", "gsrlimit": 15,
                                      "prop": "imageinfo", "iiprop": "url|extmetadata|mime", "iiurlwidth": 800})
          d = json.load(urllib.request.urlopen(urllib.request.Request("https://commons.wikimedia.org/w/api.php?" + q, headers=H), timeout=60))
          pages = sorted(d["query"]["pages"].values(), key=lambda p: p.get("index", 99))
          for p in pages:
              ii = p["imageinfo"][0]
              if ii.get("mime") in ("image/jpeg", "image/png"):
                  lic = ii.get("extmetadata", {}).get("LicenseShortName", {}).get("value")
                  print("IMAGE", p["title"], lic, ii["descriptionurl"])
                  open("input.jpg", "wb").write(urllib.request.urlopen(urllib.request.Request(ii["thumburl"], headers=H), timeout=60).read()); break
          EOF
          mkdir -p out && cp input.jpg out/input.jpg
      - name: Image -> 3D on CPU (timed)
        run: |
          cd TripoSR
          START=$(date +%s)
          python run.py ../input.jpg --device cpu --output-dir ../tsr --model-save-format obj 2>&1 | tail -n 20
          echo "TRIPOSR SECONDS $(( $(date +%s) - START ))"
          ls -R ../tsr | head
      - name: Blender 4.2 LTS + render the object
        run: |
          curl -sSL -o b.tar.xz https://download.blender.org/release/Blender4.2/blender-4.2.3-linux-x64.tar.xz
          tar -xf b.tar.xz && mv blender-4.2.3-linux-x64 blender
          M=$(ls tsr/*/mesh.* | head -1); echo "mesh $M"; cp "$M" out/
          ./blender/blender -b -noaudio --python sample_object_render.py -- "$M" out 2>&1 | grep -vE "^Fra:|Sample [0-9]" | tail -n 30
      - uses: actions/upload-artifact@v4
        with: { name: triposr-object, path: out, retention-days: 7 }
