name: episode2d
# Render a 2D episode on GitHub (no laptop needed).
# Private inputs come from the PRIVATE Kaggle dataset <user>/sonpur-2d-<ep> (bundle.tar from pipeline2d/make_bundle.py).
# The finished mp4 goes ONLY to the PRIVATE Kaggle dataset <user>/sonpur-renders. Nothing private is uploaded as a
# GitHub artifact (this repo is public, and artifacts of public repos are downloadable).
on:
  workflow_dispatch:
    inputs:
      ep:     { description: "episode id", default: "ep01" }
      units:  { description: "unit range a:b for a test (empty = whole episode)", default: "" }
      slices: { description: "parallel compose processes (empty = one per CPU)", default: "" }
      name:   { description: "output file name (no extension)", default: "ep01_draft" }
      key:    { description: "KAGGLE_KEYn secret (must own the bundle dataset)", default: "1" }
      user:   { description: "Kaggle user of that key", default: "mani7673" }
      mouth_patches: { description: "1 = drawn mouth states from the key drawings (Vertex art), 0 = old behaviour", default: "1" }
      draw_mouth:    { description: "1 = compose draws a flat cartoon mouth, 0 = off", default: "0" }

permissions:
  contents: write
  actions: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      KAGGLE_API_TOKEN: ${{ secrets[format('KAGGLE_KEY{0}', inputs.key)] }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      PYTHONUTF8: "1"
      P2D_MOUTH_PATCHES: ${{ inputs.mouth_patches }}
      P2D_DRAW_MOUTH: ${{ inputs.draw_mouth }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q numpy opencv-python-headless pillow kaggle
          test -n "$KAGGLE_API_TOKEN" || { echo "secret KAGGLE_KEY${{ inputs.key }} is empty"; exit 1; }
          nproc; free -g; df -h . | tail -1
      - name: Private bundle
        run: |
          for i in $(seq 1 40); do
            kaggle datasets download ${{ inputs.user }}/sonpur-2d-${{ inputs.ep }} -p "$RUNNER_TEMP/b" --unzip -q && break
            echo "download failed (dataset may still be processing), retry $i in 60 s"; sleep 60
          done
          # Kaggle unpacks an uploaded tar into its files; handle both forms
          if [ -f "$RUNNER_TEMP/b/bundle.tar" ]; then tar -xf "$RUNNER_TEMP/b/bundle.tar" -C "$GITHUB_WORKSPACE"
          else ls "$RUNNER_TEMP/b"; cp -r "$RUNNER_TEMP/b/." "$GITHUB_WORKSPACE/"; fi
          test -f p2d_out/${{ inputs.ep }}/plan.json || { echo "plan.json missing after unpack"; find "$GITHUB_WORKSPACE/p2d_out" -maxdepth 2 | head; exit 1; }
          # small PATCH dataset (plan.json etc.) overrides the bundle, so plan fixes do not need a 555 MB re-upload
          if kaggle datasets download ${{ inputs.user }}/sonpur-2d-${{ inputs.ep }}-patch -p "$RUNNER_TEMP/patch" --unzip -q 2>/dev/null; then
            for f in "$RUNNER_TEMP"/patch/*.json; do
              [ -f "$f" ] || continue
              case "$(basename "$f")" in mouth_pts.json) cp -v "$f" p2d_out/keys/ ;; *) cp -v "$f" p2d_out/${{ inputs.ep }}/ ;; esac
            done
          else echo "no patch dataset"; fi
          rm -rf "$RUNNER_TEMP/b" pipeline2d/out
          ln -s "$GITHUB_WORKSPACE/p2d_out" pipeline2d/out
          # the laptop wrote absolute Windows paths into a few JSON files -> rewrite them for this machine
          python3 - <<'EOF'
          import glob, json, os
          ws = os.environ["GITHUB_WORKSPACE"]; pre = "C:\\Users\\goddu\\repos\\toon-render-lab"
          def fix(x):
              if isinstance(x, dict): return {k: fix(v) for k, v in x.items()}
              if isinstance(x, list): return [fix(v) for v in x]
              if isinstance(x, str) and x.lower().startswith(pre.lower()): return ws + x[len(pre):].replace("\\", "/")
              return x
          n = 0
          for f in glob.glob("p2d_out/**/*.json", recursive=True):
              t = open(f, encoding="utf-8-sig").read()
              if "C:\\\\" not in t and "C:\\\\".lower() not in t: continue
              json.dump(fix(json.loads(t)), open(f, "w", encoding="utf-8"), ensure_ascii=False, indent=1); n += 1; print("fixed", f)
          print(n, "files rewritten")
          EOF
          ls pipeline2d/out/${{ inputs.ep }} | head -30
          du -sh p2d_out episodes 2>/dev/null || true
      - name: Render
        run: |
          mkdir -p "$RUNNER_TEMP/out"; OUT="$RUNNER_TEMP/out/${{ inputs.name }}.mp4"
          N="${{ inputs.slices }}"; [ -n "$N" ] || N=$(nproc)
          U="${{ inputs.units }}"; ARGS="--slices $N"; [ -n "$U" ] && ARGS="$ARGS --units $U"
          python3 pipeline2d/render_parallel.py ${{ inputs.ep }} "$OUT" $ARGS > "$RUNNER_TEMP/render.log" 2>&1 &
          PID=$!
          while kill -0 $PID 2>/dev/null; do
            sleep 120; date -u +%H:%M
            for l in pipeline2d/out/${{ inputs.ep }}/slices/slice_*.mp4.log; do [ -f "$l" ] && echo "  $(basename $l): $(grep -E 'frame|timeline|wrote|Error' $l | tail -1)"; done
          done
          RC=0; wait $PID || RC=$?
          cat "$RUNNER_TEMP/render.log"
          for l in pipeline2d/out/${{ inputs.ep }}/slices/slice_*.mp4.log; do echo "== $l"; tail -15 "$l"; done
          [ $RC -eq 0 ] || exit $RC
          ffprobe -v error -show_entries stream=codec_type,duration -of compact "$OUT"
          ls -la "$OUT"
      - name: QA report (one frame per shot + Gemini judge) -> control/QA_<name>.md
        if: always()
        run: |
          set +e
          OUT="$RUNNER_TEMP/out/${{ inputs.name }}.mp4"; Q="$RUNNER_TEMP/qa"; mkdir -p "$Q" control
          R="control/QA_${{ inputs.name }}.md"
          if [ -f "$OUT" ]; then
            python3 pipeline2d/qa_shots.py ${{ inputs.ep }} "$OUT" "$Q" ${{ inputs.units != '' && format('--units {0}', inputs.units) || '' }} > "$Q/qa.log" 2>&1
            echo "# QA ${{ inputs.name }} (run ${{ github.run_id }}, $(date -u +%FT%TZ))" > "$R"
            echo "" >> "$R"; echo "Frames: $(ls "$Q"/*.jpg 2>/dev/null | grep -vc sheet_) shots. Sheets: $(ls "$Q"/sheet_*.jpg 2>/dev/null | wc -l)." >> "$R"
            echo "" >> "$R"; echo "## Gemini judge" >> "$R"
            python3 tools/frame_check.py "$Q"/sheet_*.jpg --max 8 --q "Flat 2D cartoon episode frames. FAIL a frame if: a character's mouth patch is misplaced (dark/odd patch on chin, neck or cheek), a face is warped or squeezed, a white halo or jagged edge surrounds a character, a prop looks photographic/realistic instead of flat cartoon, a character floats or is cut strangely, clothing colour differs from the same character in other frames, text/gibberish appears, or the frame is black. Report per frame id (labels like s008_b) with the reason." >> "$R" 2>&1 || echo "(frame_check unavailable)" >> "$R"
          else
            echo "# QA ${{ inputs.name }}: RENDER FAILED (run ${{ github.run_id }})" > "$R"
          fi
          git config user.email "factory@kulfi"; git config user.name "factory-qa"
          git add "$R"; git commit -m "QA report for ${{ inputs.name }} (run ${{ github.run_id }})" || true
          git pull --rebase origin main || true; git push origin HEAD:main || true
      - name: Save to the private Kaggle dataset
        run: |
          D="$RUNNER_TEMP/ds"; mkdir -p "$D"; REF=${{ inputs.user }}/sonpur-renders
          if kaggle datasets status $REF 2>/dev/null | grep -qi ready; then
            kaggle datasets download $REF -p "$D" --unzip -q || true
            cp "$RUNNER_TEMP/out/${{ inputs.name }}.mp4" "$D/"
            echo "{\"title\": \"sonpur-renders\", \"id\": \"$REF\", \"licenses\": [{\"name\": \"other\"}]}" > "$D/dataset-metadata.json"
            kaggle datasets version -p "$D" -m "${{ inputs.name }} (run ${{ github.run_id }})"
          else
            cp "$RUNNER_TEMP/out/${{ inputs.name }}.mp4" "$D/"
            echo "{\"title\": \"sonpur-renders\", \"id\": \"$REF\", \"licenses\": [{\"name\": \"other\"}]}" > "$D/dataset-metadata.json"
            kaggle datasets create -p "$D"
          fi
          ls -la "$D"
