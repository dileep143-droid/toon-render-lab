name: motionpacks
# Ready-made motion library -> MPFB rigs (lib_motionlib). Raw and retargeted motion data NEVER leave this run unencrypted:
# between jobs they travel as AES-256 encrypted artifacts (key = KAGGLE_KEY1 secret) and they end up only in the PRIVATE
# Kaggle datasets mani7673/sonpur-motion-packs (commercial OK) and mani7673/sonpur-motion-nc (non-commercial).
# Public artifacts: rigs.json (MPFB CC0 bone data), catalogue metadata, check-sheet PNGs of dressed cast members.
on:
  workflow_dispatch:
    inputs:
      packs:   { description: "comma list or all: cmu,style100,bandai,lafan,zeggs,motorica,interact,quaternius", default: "all" }
      publish: { description: "create/version the Kaggle datasets (true/false)", default: "true" }
      sheets:  { description: "render the check sheet on GitHub (true/false); normally the Kaggle GPU kernel does it", default: "false" }
      blendlib: { description: "bake .blend action libraries on GitHub (true/false)", default: "false" }
      from_run: { description: "reuse the md-* artifacts of an earlier run id (skips download + retarget)", default: "" }
env:
  MP_KEY: ${{ secrets.KAGGLE_KEY1 }}
  PYTHONUNBUFFERED: "1"

jobs:
  mhpack:      # the MakeHuman CC0 asset server is slow (~13 min): download once into the Actions cache
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/cache@v4
        id: c
        with:
          path: |
            pack
            functional
          key: mh-cc0-pack-v1
      - if: steps.c.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -A "Mozilla/5.0" -o pack.zip https://files2.makehumancommunity.org/asset_packs/makehuman_system_assets/makehuman_system_assets_cc0.zip
          mkdir -p pack functional && unzip -q pack.zip -d pack && rm pack.zip
          for p in faceunits01 visemes01; do curl -fsSL -A "Mozilla/5.0" -o functional/$p.zip https://files2.makehumancommunity.org/functional/$p.zip; done

  collect:     # the retarget shards run as private Kaggle CPU kernels (kaggle/motionpacks/kaggle_dispatch.py push); fetch their outputs
    if: inputs.packs != 'quaternius'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      K2: ${{ secrets.KAGGLE_KEY2 }}
      K3: ${{ secrets.KAGGLE_KEY3 }}
      K4: ${{ secrets.KAGGLE_KEY4 }}
      K5: ${{ secrets.KAGGLE_KEY5 }}
      K6: ${{ secrets.KAGGLE_KEY6 }}
      K7: ${{ secrets.KAGGLE_KEY7 }}
      K8: ${{ secrets.KAGGLE_KEY8 }}
      K9: ${{ secrets.KAGGLE_KEY9 }}
      K10: ${{ secrets.KAGGLE_KEY10 }}
      K11: ${{ secrets.KAGGLE_KEY11 }}
      K12: ${{ secrets.KAGGLE_KEY12 }}
      K13: ${{ secrets.KAGGLE_KEY13 }}
      K14: ${{ secrets.KAGGLE_KEY14 }}
      K15: ${{ secrets.KAGGLE_KEY15 }}
      K17: ${{ secrets.KAGGLE_KEY17 }}
      K18: ${{ secrets.KAGGLE_KEY18 }}
      K19: ${{ secrets.KAGGLE_KEY19 }}
      K20: ${{ secrets.KAGGLE_KEY20 }}
    steps:
      - uses: actions/checkout@v4
      - name: Wait for the Kaggle kernels and collect their outputs
        run: |
          pip install -q --upgrade kaggle
          python3 kaggle/motionpacks/collect.py $RUNNER_TEMP/out 320
          cd $RUNNER_TEMP && tar -cf out.tar out && du -sh out.tar && openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:MP_KEY -in out.tar -out md.enc
      - uses: actions/upload-artifact@v4
        with: { name: md-kaggle-0, path: "${{ runner.temp }}/md.enc", retention-days: 3, compression-level: 0 }

  quaternius:
    if: inputs.packs == 'all' || contains(inputs.packs, 'quaternius')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Blender 4.2
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q libxi6 libxxf86vm1 libxfixes3 libxrender1 libgl1 libegl1 libxkbcommon0 libsm6 > /dev/null
          curl -sSL -o b.tar.xz https://download.blender.org/release/Blender4.2/blender-4.2.3-linux-x64.tar.xz && tar -xf b.tar.xz && mv blender-4.2.3-linux-x64 blender
      - name: Sample Quaternius UAL 1+2 (CC0)
        run: |
          mkdir -p qz && cd qz
          curl -fsSL -A "Mozilla/5.0" -o ual1.zip https://opengameart.org/sites/default/files/universal_animation_librarystandard.zip
          curl -fsSL -A "Mozilla/5.0" -o ual2.zip https://opengameart.org/sites/default/files/universal_animation_library_2standard.zip
          cd .. && export MOTION_RIGS=$PWD/kaggle/motionpacks/rigs.json
          ./blender/blender -b -noaudio --python kaggle/motionpacks/blender_prep.py -- quaternius qz $RUNNER_TEMP/out 2>&1 | grep -E "ZIP|QUATERNIUS|PACK|ERR|Error|Traceback|line [0-9]" | cut -c1-3000
          cd $RUNNER_TEMP && tar -cf out.tar out && openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:MP_KEY -in out.tar -out md.enc
      - uses: actions/upload-artifact@v4
        with: { name: md-quaternius-0, path: "${{ runner.temp }}/md.enc", retention-days: 3, compression-level: 0 }

  merge:
    needs: [collect, quaternius]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        if: inputs.from_run != ''
        with: { pattern: "md-*", path: enc_old, run-id: "${{ inputs.from_run }}", github-token: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with: { pattern: "md-*", path: enc }
      - name: Decrypt + merge catalogues
        run: |
          pip install -q numpy
          bash kaggle/motionpacks/decrypt_all.sh enc mdroot
          python3 kaggle/motionpacks/merge.py mdroot merged stories/hindi/ASSET_NEEDS.json
      - uses: actions/upload-artifact@v4
        with: { name: merged, path: merged, retention-days: 7 }

  sheet:
    needs: [merge, mhpack]
    if: ${{ !cancelled() && needs.merge.result == 'success' && inputs.sheets != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 200
    strategy:
      fail-fast: false
      matrix: { shard: [0, 1, 2, 3, 4, 5, 6, 7] }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        if: inputs.from_run != ''
        with: { pattern: "md-*", path: enc_old, run-id: "${{ inputs.from_run }}", github-token: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with: { pattern: "md-*", path: enc }
      - uses: actions/download-artifact@v4
        with: { name: merged, path: merged }
      - uses: actions/cache/restore@v4
        with:
          path: |
            pack
            functional
          key: mh-cc0-pack-v1
      - name: Blender 4.2 + MPFB + MakeHuman CC0 packs
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q libxi6 libxxf86vm1 libxfixes3 libxrender1 libgl1 libegl1 libxkbcommon0 libsm6 > /dev/null
          bash kaggle/motionpacks/setup_blender.sh
          bash kaggle/motionpacks/decrypt_all.sh enc mdroot
          python3 -c "import json;d=json.load(open('merged/motion_catalogue_all.json'));json.dump(d,open('mdroot/motion_catalogue.json','w'))"
      - name: Render tiles (shard ${{ matrix.shard }})
        run: ./blender/blender -b -noaudio --python kaggle/motionpacks/sheet_render.py -- pack functional $PWD/mdroot merged/sheet_selection.json tiles ${{ matrix.shard }} 8 2>&1 | grep -vE "^Fra:|Sample [0-9]" | grep -E "CAST|TILE|SKIP|SHEET|MOTION|NON-COMMERCIAL|Error|Traceback|line [0-9]|refusing" | cut -c1-700 | tail -n 400
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: "tiles-${{ matrix.shard }}", path: tiles, retention-days: 7, if-no-files-found: ignore }

  assemble:
    needs: sheet
    if: ${{ !cancelled() && needs.sheet.result != 'skipped' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { pattern: "tiles-*", path: tiles }
      - run: |
          pip install -q pillow; sudo apt-get install -y -q fonts-dejavu-core > /dev/null || true
          python3 kaggle/motionpacks/sheet_assemble.py tiles sheets
      - uses: actions/upload-artifact@v4
        with: { name: sheets, path: sheets, retention-days: 14 }

  blendlib:
    needs: [merge, mhpack]
    if: ${{ !cancelled() && needs.merge.result == 'success' && inputs.blendlib == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        if: inputs.from_run != ''
        with: { pattern: "md-*", path: enc_old, run-id: "${{ inputs.from_run }}", github-token: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with: { pattern: "md-*", path: enc }
      - uses: actions/download-artifact@v4
        with: { name: merged, path: merged }
      - uses: actions/cache/restore@v4
        with:
          path: |
            pack
            functional
          key: mh-cc0-pack-v1
      - name: Blender 4.2 + MPFB
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q libxi6 libxxf86vm1 libxfixes3 libxrender1 libgl1 libegl1 libxkbcommon0 libsm6 > /dev/null
          bash kaggle/motionpacks/setup_blender.sh
          bash kaggle/motionpacks/decrypt_all.sh enc mdroot
          python3 -c "import json;d=json.load(open('merged/motion_catalogue_all.json'));json.dump(d,open('mdroot/motion_catalogue.json','w'))"
      - name: Bake .blend action libraries
        run: |
          ./blender/blender -b -noaudio --python kaggle/motionpacks/blend_lib.py -- pack functional $PWD/mdroot merged blend 2>&1 | grep -E "BLEND|BAKE FAIL|Error|Traceback|line [0-9]" | tail -n 80
          tar -cf blend.tar blend && openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:MP_KEY -in blend.tar -out blend.enc && du -sh blend
      - uses: actions/upload-artifact@v4
        with: { name: blend-enc, path: blend.enc, retention-days: 3, compression-level: 0 }

  publish:
    needs: [merge, blendlib]
    if: ${{ !cancelled() && needs.merge.result == 'success' && inputs.publish != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix: { which: [packs, nc] }
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_KEY1 }}
    steps:
      - uses: actions/checkout@v4
      - name: Free disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL; df -h / | tail -1
      - uses: actions/download-artifact@v4
        if: inputs.from_run != ''
        with: { pattern: "md-*", path: enc_old, run-id: "${{ inputs.from_run }}", github-token: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with: { pattern: "md-*", path: enc }
      - uses: actions/download-artifact@v4
        with: { name: merged, path: merged }
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with: { name: blend-enc, path: blendenc }
      - name: Publish ${{ matrix.which }} to Kaggle (private)
        run: |
          pip install -q --upgrade kaggle numpy
          bash kaggle/motionpacks/decrypt_all.sh enc mdroot
          if [ -f blendenc/blend.enc ]; then openssl enc -d -aes-256-cbc -pbkdf2 -pass env:MP_KEY -in blendenc/blend.enc | tar -xf -; fi
          python3 kaggle/motionpacks/publish.py ${{ matrix.which }} mdroot merged $RUNNER_TEMP/stage blend
