name: make-objects
on:
  workflow_dispatch: {}

jobs:
  picture-to-3d:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.10" }
      - name: Libraries
        run: sudo apt-get update -q && sudo apt-get install -y -q libxi6 libxxf86vm1 libxfixes3 libxrender1 libgl1 libegl1 libxkbcommon0 libsm6 cmake
      - name: Make clean pictures with FLUX.1-schnell (Apache-2.0) on a free Hugging Face Space
        run: |
          pip install -q gradio_client pillow
          python3 make_object_pictures.py pictures
          cp sample_inputs/*.png pictures/ 2>/dev/null || true
          ls -la pictures
      - name: TripoSR (MIT) on CPU
        run: |
          git clone --depth 1 https://github.com/VAST-AI-Research/TripoSR.git
          pip install -q torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -q scikit-build-core pybind11 cmake ninja
          pip install -q --no-build-isolation git+https://github.com/tatsy/torchmcubes.git
          grep -v torchmcubes TripoSR/requirements.txt > req.txt && pip install -q -r req.txt onnxruntime
      - name: Pictures -> 3D (timed)
        run: |
          cd TripoSR
          for f in ../pictures/*.png; do
            n=$(basename "$f" .png); START=$(date +%s)
            python run.py "$f" --device cpu --output-dir "../tsr/$n" --model-save-format obj --foreground-ratio 0.85 --mc-resolution 320 2>&1 | tail -n 3
            echo "TRIPOSR $n SECONDS $(( $(date +%s) - START ))"
          done
      - name: Blender 4.2 LTS + render each object
        run: |
          curl -sSL -o b.tar.xz https://download.blender.org/release/Blender4.2/blender-4.2.3-linux-x64.tar.xz
          tar -xf b.tar.xz && mv blender-4.2.3-linux-x64 blender
          mkdir -p out && cp pictures/*.png out/
          for d in tsr/*; do
            n=$(basename "$d"); M=$(ls $d/*/mesh.obj | head -1); cp "$M" "out/$n.obj"
            ./blender/blender -b -noaudio --python sample_object_render.py -- "$M" "out/$n" 2>&1 | grep -E "IMPORTED|ORIENT|DONE|Error|Traceback" | tail -n 10
          done
      - uses: actions/upload-artifact@v4
        with: { name: objects, path: out, retention-days: 7 }
