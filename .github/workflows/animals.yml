name: animals-preview
on:
  workflow_dispatch:
    inputs:
      actions:
        description: "comma list of action names, or all"
        default: "all"

jobs:
  animals:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Libraries
        run: sudo apt-get update -q && sudo apt-get install -y -q libxi6 libxxf86vm1 libxfixes3 libxrender1 libgl1 libegl1 libxkbcommon0 libsm6
      - name: Blender 4.2 LTS
        run: |
          curl -sSL -o b.tar.xz https://download.blender.org/release/Blender4.2/blender-4.2.3-linux-x64.tar.xz
          tar -xf b.tar.xz && mv blender-4.2.3-linux-x64 blender
      - name: Contact sheets (Workbench) - CHAMKI + SHERU on 4.2
        run: |
          ./blender/blender -b -noaudio --python preview_animals.py -- out chamki,sheru ${{ inputs.actions }} 5 workbench 200 2>&1 | grep -vE "^Fra:|Saved:|^\s*$" | tail -n 120
          ls -la out
      - name: Eevee stills (a few actions)
        run: |
          ./blender/blender -b -noaudio --python preview_animals.py -- out_eevee chamki,sheru idle,bleat,bark,sleep,sit,roll_over,expr_guilty 3 eevee 320 2>&1 | grep -vE "^Fra:|Saved:|^\s*$" | tail -n 60
      - uses: actions/upload-artifact@v4
        with: { name: animals-preview, path: "out*", retention-days: 7 }
