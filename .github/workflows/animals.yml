name: animals-preview
on:
  workflow_dispatch:
    inputs:
      parts:
        description: "actions,emotions,language,clip (comma list)"
        default: "actions,emotions,language,clip"

jobs:
  animals:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        who: [chamki, sheru, generic]
    steps:
      - uses: actions/checkout@v4
      - name: Libraries
        run: sudo apt-get update -q && sudo apt-get install -y -q libxi6 libxxf86vm1 libxfixes3 libxrender1 libgl1 libegl1 libxkbcommon0 libsm6
      - name: Blender 4.2 LTS
        run: |
          curl -sSL -o b.tar.xz https://download.blender.org/release/Blender4.2/blender-4.2.3-linux-x64.tar.xz
          tar -xf b.tar.xz && mv blender-4.2.3-linux-x64 blender
      - name: Sheets + checks (${{ matrix.who }})
        run: |
          set -o pipefail
          ./blender/blender -b -noaudio --python-exit-code 1 --python preview_animals.py -- out ${{ matrix.who }} ${{ inputs.parts }} 2>&1 | grep -vE "^Fra:|Saved:|^\s*$|Append frame|Time:|Mem:" | tail -n 400
          ls -la out
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: "animals-${{ matrix.who }}", path: "out/*.png\nout/*.mp4\nout/*.txt", retention-days: 7 }
